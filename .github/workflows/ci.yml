name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  windows:
    name: Windows build and tests
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure
        run: cmake -S . -B build/ci -A x64 -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build/ci --config Debug --parallel

      - name: Test
        run: ctest --test-dir build/ci -C Debug --output-on-failure
